name: grid_cockpit
description: Watch-only macOS operator client for a resident grid station.
repository: https://github.com/memento-engineering/the_grid
resolution: workspace
publish_to: none
version: 0.1.0+1

environment:
  flutter: ">=3.41.0"
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  freezed_annotation: ^3.0.0
  grid_cockpit_ui:
    path: ../grid_cockpit_ui
  grid_diagnostics_contract:
    path: ../grid_diagnostics_contract
  grid_station_client:
    path: ../grid_station_client

dev_dependencies:
  build_runner: ^2.4.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  genesis_foundation: ^0.2.0
  lints: ^5.1.0

flutter:
  uses-material-design: true
