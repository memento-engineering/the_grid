name: grid_engine
# Released as git tags per package (power_station ADR-0003 D1:
# `<package>-v<version>`); consumers pin `git: {url, ref, path}`.
version: 0.4.0-dev.1
description: >-
  Tree engine for the_grid — genesis_tree reconciles the running system:
  build(observed), mount = spawn, unmount = kill.
repository: https://github.com/memento-engineering/the_grid
resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  beads_dart: ^0.2.0
  freezed_annotation: ^3.0.0
  genesis_foundation: ^0.2.0
  # The published engine substrate. Version 0.4.0 owns the Provider
  # composition layer that the_grid consumes instead of carrying privately.
  genesis_tree: ^0.4.0
  grid_runtime: ^0.2.0
  json_annotation: ^4.9.0
  meta: ^1.16.0
  path: ^1.9.0
  # The reactive value type — predictable-flutter / lenny house style; the
  # §6.6 Riverpod→StateNotifier reversal.
  state_notifier: ^1.0.0

dev_dependencies:
  build_runner: ^2.4.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  lints: ^5.1.0
  test: ^1.25.0
