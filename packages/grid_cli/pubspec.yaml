name: grid_cli
# Released as git tags per package (power_station ADR-0003 D1:
# `<package>-v<version>`); consumers pin `git: {url, ref, path}`.
version: 0.5.0-rc.2
description: >-
  Management CLI for the_grid — `grid watch` and companion commands for
  operating a grid station.
repository: https://github.com/memento-engineering/the_grid
resolution: workspace

environment:
  sdk: ^3.11.0

executables:
  grid:

dependencies:
  args: ^2.6.0
  beads_dart: ^0.2.0-rc.1
  genesis_foundation: ^0.2.0
  genesis_tree: ^0.2.0
  grid_diagnostics_contract: ^0.2.0
  grid_engine: ^0.3.0-rc.1
  grid_exploration: ^0.3.0-rc.1
  grid_runtime: ^0.2.0-rc.1
  grid_sdk: ^0.3.0-rc.1
  meta: ^1.15.0
  path: ^1.9.0
  # The VM-service client `reload` drives: reloadSources + the
  # ext.leonard.grid.reload invoke.
  vm_service: ^14.2.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0
