floor: v1.0.5
# `floor` is the oldest bd this package supports. Together with upstream's
# latest RELEASE it forms the compatibility matrix the publish workflow runs
# before publishing.
#
# There is deliberately no release-embargo key here. A `day_one_wait_through`
# gate briefly refused every beads_dart publish while upstream's latest release
# sorted below it, which blocked 0.2.0-rc.6 (and power_station behind it) for a
# reason unrelated to that release: this package ships CANDIDATES against bd's
# own CANDIDATES, so what upstream has promoted to a release says nothing about
# whether a beads_dart candidate may ship. Compatibility evidence is the matrix
# plus the fixture sets under fixtures/upstream/, never a hold on the tag.
fork_patches:
  graph_apply_parent_cycle_skip:
    repository: nicholasspencer/beads
    base_sha: f9fe4ef2a6d3d90b52f1b62df15a5b2c0833c82b
    ref: grid-v1.0.5-graph-apply-parent-cycle-skip.1
    fixture_set: 2026-09-01-bd-grid-v1.0.5-graph-apply-parent-cycle-skip.1
    resolved_sha_receipt: fixtures/upstream/2026-09-01-bd-grid-v1.0.5-graph-apply-parent-cycle-skip.1/README.md
