name: the_grid_workspace
publish_to: none
environment:
  sdk: ^3.11.0
workspace:
  - packages/beads_dart
  - packages/grid_cli
  - packages/grid_exploration
  - packages/grid_diagnostics_contract
  - packages/grid_cockpit_ui
  - packages/grid_station_client
  - packages/grid_devtools
  - packages/grid_cockpit
  - packages/grid_runtime
  - packages/grid_engine
  # The public authoring surface over the private grid_engine (ADR-0008 D2 /
  # ADR-0002; consumers never import the engine). Born in tg-4ab (Track A).
  - packages/grid_sdk
  # Trajectory substrate (tg-zfek Stage 0) — a LEAF below the whole chain,
  # like beads_dart: zero grid_* deps (decision: grid-trajectory-leaf-package).
  - packages/grid_trajectory

# genesis_tree is the published M4 engine substrate (ADR-0007). Member packages
# consume stable 0.4.0 from pub.dev so deep per-bead worktrees resolve without a
# sibling-checkout path dependency.
# This workspace-only override bridges the genesis → grid → power publish
# cascade. Remove it when pow-jz93 lands and the power packages accept 0.4.0.
dependency_overrides:
  genesis_tree: ^0.4.0
  # Same bridge for the grid_engine 0.4.0-dev.1 wave (tg-rvib): grid_cockpit reaches the hosted
  # federated_grid_assets 0.3.0, whose grid_engine ^0.3.0 pin forbids this workspace's own
  # grid_engine. A workspace member cannot be overridden, so the hosted consumer is pointed at
  # power_station's release/grid-engine-0.4-bridge commit, which pins grid_engine ^0.4.0-dev.1.
  # Remove it together with the genesis_tree line when pow-jz93 lands.
  federated_grid_assets:
    git:
      url: https://github.com/memento-engineering/power_station.git
      ref: 7b0792d6423a69f3f7fde9107d103d3b6d892ff1
      path: packages/federated_grid_assets

dev_dependencies:
  melos: ^7.7.0

melos:
  scripts:
    # ---------- primary scripts ----------
    test:
      description: >-
        Run the offline unit suite (excludes `integration`-tagged tests, which
        need bd/Dolt). Runs dart test on pure-Dart packages and flutter test on
        Flutter packages.
      steps:
        - test:dart
        - test:flutter

    test:integration:
      description: >-
        Run the integration-tagged suite (requires `bd` on PATH; SQL/VM-service
        cases self-skip without GC_DOLT_PASSWORD / --enable-vm-service).
      exec: dart test -t integration
      packageFilters:
        flutter: false
        dirExists: test

    analyze:
      description: >-
        Run dart analyze on the entire workspace.
      run: dart analyze

    format:
      description: >-
        Check formatting for all Dart files. Fails if any file needs changes.
      run: dart format --output=none --set-exit-if-changed .

    build_runner:
      description: >-
        Run build_runner codegen in every package that declares it.
      exec: dart run build_runner build --delete-conflicting-outputs
      packageFilters:
        dependsOn: build_runner

    # ---------- private sub-scripts (not listed by melos run) ----------
    test:dart:
      private: true
      description: dart test on pure-Dart packages (offline; excludes integration)
      exec: dart test -x integration
      packageFilters:
        flutter: false
        dirExists: test

    test:flutter:
      private: true
      description: flutter test on Flutter packages (offline; excludes integration)
      exec: flutter test -x integration
      packageFilters:
        flutter: true
        dirExists: test
