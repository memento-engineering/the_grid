name: the_grid_decisions_lint_check
description: >-
  Ad hoc, reproducible before/after `decisions lint` comparison for tg-vmtd
  (AC-5: the register lints no worse after retiring the orphaned ADR
  originals directory). Not a workspace
  member and not part of the register — it exists only so a clean checkout
  can lint docs/decisions with the same engine the station composes, the way
  memento-engineering/tool does for the org register.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.11.0

dependencies:
  decisions:
    git:
      url: https://github.com/memento-engineering/decisions.git
      path: cli/dart/decisions
      ref: decisions-v0.2.0
  path: ^1.9.0
