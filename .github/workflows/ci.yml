name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Merge-queue validation: without this trigger, required checks never run on
  # queued merge groups and every enqueued PR hangs forever.
  merge_group:

jobs:
  dart:
    name: analyze + test (Dart packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The workspace includes Flutter members (grid_cockpit_ui, grid_devtools),
      # so root resolution needs the Flutter SDK even for the Dart-only job.
      - uses: subosito/flutter-action@v2
        with:
          # PINNED, deliberately. `channel: stable` floats: when it resolved
          # Flutter 3.47.0 (2026-08-12) the bundled Dart formatter changed and
          # three already-committed test files became "unformatted", turning the
          # workspace format gate red on pull requests without a source line
          # changing. CI must not drift ahead of the toolchain we develop on.
          # Bump deliberately, together with local SDKs and a reformat.
          channel: stable
          flutter-version: 3.44.8
      - name: Resolve workspace
        run: flutter pub get
      - name: Format (workspace-wide)
        run: dart format --output=none --set-exit-if-changed packages
      - name: Analyze (workspace-wide)
        run: dart analyze
      - name: Test pure-Dart packages
        # beads_dart is EXCLUDED: its suite shells out to the bd/dolt binaries
        # and carries a documented bd-HEAD ready-sort divergence (tg-nx0o).
        # Hermeticizing it for CI is tracked as a follow-up bead.
        run: |
          for pkg in grid_diagnostics_contract grid_runtime grid_exploration grid_engine grid_cli; do
            echo "::group::$pkg"
            (cd packages/$pkg && dart test)
            echo "::endgroup::"
          done
          # grid_trajectory's integration tag is the Stage-0 guard suite. It
          # FAILS rather than skips without dolt (decision:
          # stage0-guards-gate-prs), and this job installs none — the guards
          # run in trajectory-guards below.
          echo "::group::grid_trajectory"
          (cd packages/grid_trajectory && dart test -x integration)
          echo "::endgroup::"
          # grid_sdk carries the Stage-1 harness integration test, which is
          # trajectory-guard-class: it FAILS rather than skips without dolt
          # (decision: stage0-guards-gate-prs). Unit tier here; integration
          # tier in trajectory-guards below.
          echo "::group::grid_sdk"
          (cd packages/grid_sdk && dart test -x integration)
          echo "::endgroup::"

  trajectory-guards:
    name: Trajectory guards (dolt) — Stage-0 seven + Stage-1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PINNED, and pinned independently of the Dart toolchain: these guards
      # assert dolt's own observed behavior (1213 arbitration, dolt_ignore
      # suppression, the force-add trap), so a floating dolt would turn a
      # server-side change into an unexplained red PR. dolthub/setup-dolt@v1
      # stopped resolving (2026-08), so install from the release tarball.
      - name: Install dolt
        env:
          DOLT_VERSION: 2.2.2
        run: |
          curl -fsSL -o /tmp/dolt.tar.gz \
            "https://github.com/dolthub/dolt/releases/download/v${DOLT_VERSION}/dolt-linux-amd64.tar.gz"
          tar -xzf /tmp/dolt.tar.gz -C /tmp
          sudo install "$(find /tmp/dolt-linux-amd64 -type f -name dolt | head -n1)" /usr/local/bin/dolt
          dolt version
      # The workspace includes Flutter members, so root resolution needs the
      # Flutter SDK even for this Dart-only job.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
      - name: Resolve workspace
        run: flutter pub get
      - name: Run the tagged guard suite
        run: |
          cd packages/grid_trajectory
          dart test -t integration
          cd ../grid_sdk
          dart test -t integration
      # FAIL-CLOSED naming pin. The step above selects by TAG, so a guard file
      # that loses its `@Tags(['integration'])` annotation silently stops
      # gating PRs while this job stays green. Naming the Stage-1 guards by
      # PATH turns that into a red run instead: an untagged, renamed, or
      # deleted file selects zero tests here and `dart test` exits non-zero.
      - name: Stage-1 guard pin — provision verb + fold measurement
        run: |
          cd packages/grid_trajectory
          dart test -t integration \
            test/integration/traj_provision_integration_test.dart \
            test/integration/stage1_fold_measurement_test.dart
      # The C0 operator verbs, pinned by PATH for the same fail-closed reason:
      # the replay GOLDEN (what the verb writes == what the pure fold says) is
      # what the whole rebuildability constraint rests on, and the quiesce
      # fence is the guard whose silent absence would let a live replay erase
      # fold effects nothing downstream can detect. The journal-column rename
      # rides the same file: it is the one migration in the schema that ALTERs
      # dolt-versioned truth, so its statements are pinned against real dolt
      # rather than against a scripted fake.
      - name: Wave-1 guard pin — traj replay (golden, fence, reshape, journal rename) + traj gc
        run: |
          cd packages/grid_trajectory
          dart test -t integration \
            test/integration/traj_operator_verbs_integration_test.dart
      # The shadow window's own tooling is pure-Dart and also runs in the
      # `dart` job's wildcard — but a §9 stage cut is adjudicated on exactly
      # what these produce, so they are named rather than left to a wildcard,
      # for the same fail-closed reason as above.
      - name: Stage-1 guard pin — shadow lanes + round-disqualification gating
        run: |
          cd packages/grid_trajectory
          dart test \
            test/shadow \
            test/cli/traj_shadow_diff_command_test.dart \
            test/cli/traj_shadow_diff_accounting_test.dart

  flutter:
    name: analyze + test (Flutter packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # PINNED, deliberately. `channel: stable` floats: when it resolved
          # Flutter 3.47.0 (2026-08-12) the bundled Dart formatter changed and
          # three already-committed test files became "unformatted", turning the
          # workspace format gate red on pull requests without a source line
          # changing. CI must not drift ahead of the toolchain we develop on.
          # Bump deliberately, together with local SDKs and a reformat.
          channel: stable
          flutter-version: 3.44.8
      - name: Resolve workspace
        run: flutter pub get
      - name: Test Flutter packages
        run: |
          for pkg in grid_cockpit_ui grid_devtools; do
            echo "::group::$pkg"
            (cd packages/$pkg && flutter analyze && flutter test)
            echo "::endgroup::"
          done
