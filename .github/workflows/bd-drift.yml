name: bd drift

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bd-drift

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gastownhall/beads
          ref: main
          path: upstream-beads
      - id: upstream
        run: echo "upstream_sha=$(git -C upstream-beads rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream-beads/go.mod
      # dolthub/setup-dolt@v1 no longer exists (404, 2026-09-02).
      - name: Install dolt
        run: |
          curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/install.sh | sudo bash
          dolt version
      - name: Build bd
        run: |
          mkdir -p "${{ runner.temp }}/bin"
          (cd upstream-beads && CGO_ENABLED=1 go build -tags gms_pure_go -o "${{ runner.temp }}/bin/bd" ./cmd/bd)
      - name: Run compatibility suite
        run: tool/bd_compatibility/run.sh "${{ github.workspace }}/upstream-beads" "${{ runner.temp }}/bin/bd"
      - name: File drift alarm
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          BEADS_DOLT_PASSWORD: ${{ secrets.BEADS_DOLT_PASSWORD }}
        run: BD_BIN="${{ runner.temp }}/bin/bd" tool/bd_compatibility/file_drift.sh "${{ steps.upstream.outputs.upstream_sha }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
