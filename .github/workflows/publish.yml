name: Publish to pub.dev

# Per-package release tags: `<package>-v<version>` (power_station ADR-0003 D1
# naming, now pointed at pub.dev). Pushing e.g. `grid_engine-v0.1.1` publishes
# packages/grid_engine via pub.dev's GitHub-Actions trusted publishing (OIDC —
# no long-lived credential in CI). Each package must have automated publishing
# enabled once on its pub.dev admin page (repository memento-engineering/the_grid,
# tag pattern `<package>-v{{version}}`).

on:
  push:
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+'
      - '*-v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      bd_refs: ${{ steps.parse.outputs.bd_refs }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg="${GITHUB_REF_NAME%-v*}"
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          echo "Publishing package: $pkg (tag $GITHUB_REF_NAME)"
          if [[ "$pkg" != beads_dart ]]; then
            echo 'bd_refs=["none"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          policy=packages/beads_dart/bd_compatibility.yaml
          floor=$(ruby -e 'require "yaml"; puts YAML.load_file(ARGV[0]).fetch(ARGV[1])' "$policy" floor)
          wait=$(ruby -e 'require "yaml"; puts YAML.load_file(ARGV[0]).fetch(ARGV[1])' "$policy" day_one_wait_through)
          latest=$(gh api repos/gastownhall/beads/releases/latest --jq .tag_name)
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          [[ "$floor" =~ $semver && "$wait" =~ $semver && "$latest" =~ $semver ]] || {
            echo 'bd compatibility policy and latest release must be vMAJOR.MINOR.PATCH' >&2
            exit 1
          }
          newest=$(printf '%s\n%s\n' "$wait" "$latest" | sort -V | tail -n1)
          [[ "$newest" == "$latest" && "$latest" != "$wait" ]] || {
            echo "beads_dart release waits for a bd tag newer than $wait" >&2
            exit 1
          }
          echo "bd_refs=$(jq -cn --arg floor "$floor" --arg latest "$latest" '[$floor,$latest]|unique')" >> "$GITHUB_OUTPUT"

  bd-compatibility:
    # Runs ONLY for beads_dart. A job-level `if` is required (not step-level):
    # GitHub resolves every DECLARED action at job setup regardless of step
    # ifs, so an unresolvable action (dolthub/setup-dolt went missing
    # 2026-08) failed EVERY publish run, for every package, before any
    # step-if applied.
    if: needs.parse.outputs.package == 'beads_dart'
    needs: parse
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bd_ref: ${{ fromJSON(needs.parse.outputs.bd_refs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: gastownhall/beads
          ref: ${{ matrix.bd_ref }}
          path: ${{ runner.temp }}/beads
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/beads/go.mod
      # dolthub/setup-dolt@v1 no longer exists (404, 2026-09-02); install
      # dolt with the release install script instead.
      - name: Install dolt
        run: |
          curl -fsSL https://github.com/dolthub/dolt/releases/latest/download/install.sh | sudo bash
          dolt version
      - name: Build bd
        run: |
          mkdir -p "${{ runner.temp }}/bin"
          (cd "${{ runner.temp }}/beads" && CGO_ENABLED=0 go build -tags gms_pure_go -o "${{ runner.temp }}/bin/bd" ./cmd/bd)
      - name: Run compatibility suite
        run: tool/bd_compatibility/run.sh "${{ runner.temp }}/beads" "${{ runner.temp }}/bin/bd"

  publish:
    needs: [parse, bd-compatibility]
    # bd-compatibility SKIPS for every package except beads_dart; a skipped
    # need must not skip the publish.
    # grid_exploration publishes through its own job below (it needs a built
    # DevTools bundle the reusable workflow cannot produce).
    if: ${{ !cancelled() && needs.parse.result == 'success' && needs.parse.outputs.package != 'grid_exploration' && (needs.bd-compatibility.result == 'success' || needs.bd-compatibility.result == 'skipped') }}
    permissions:
      id-token: write # pub.dev OIDC trusted publishing
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/${{ needs.parse.outputs.package }}

  publish-grid-exploration:
    # grid_exploration ships the `grid` DevTools panel under
    # extension/devtools/build/ — gitignored, let into the archive by the
    # package's .pubignore. pub.dev refuses the package when that directory is
    # absent ("It looks like you are making a devtools extension!"), which is
    # why every grid_exploration release before 0.3.0-rc.4 was hand-published
    # and the only tag-push run (v0.1.1) failed. This job builds the bundle
    # with tool/build_devtools_extension.sh before `dart pub publish`; the OIDC
    # trusted-publishing exchange happens inside pub itself under id-token.
    needs: parse
    if: needs.parse.outputs.package == 'grid_exploration'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # pub.dev OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build the DevTools bundle into grid_exploration
        run: tool/build_devtools_extension.sh
      - name: Publish grid_exploration
        working-directory: packages/grid_exploration
        run: |
          test -s extension/devtools/build/index.html
          dart pub get
          dart pub publish --force
